<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Frise Chronologique</title>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>L'Histoire en Frise Chronologique</h1>
    <h2>Voyage à travers les siècles</h2>
  </header>

  <div class="timeline-container">
    <div class="timeline">
      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XXI</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XX</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XIX</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XVIII</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XVII</div>

        <div class="century-horizontal-line"></div>

        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XV</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XV</div>
        <div class="event-point" data-title="Prise de Constantinople" data-details="1453, fin de l'Empire byzantin."></div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XIV</div>
        <div class="event-point" data-title="La peste noire" data-details="Entre 1347 et 1352, la peste noire ravage l'Europe."></div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XIII</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">XII</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>

      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>

        <div class="century-label">X</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">IX</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">VIII</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">VII</div>
      </div>

      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">II</div>
      </div>

      <div class="century">
        <div class="century-horizontal-line"></div>
        <div class="century-line"></div>
        <div class="century-label">I</div>
      </div>
    </div>
  </div>

  <div class="event-popup hidden">
    <div class="line"></div>
    <div class="event-details">
      <div class="left-text"></div>
      <div class="right-text"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
